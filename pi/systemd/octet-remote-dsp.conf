# SOURCE-ONLY drop-in template for octet-remote.service: not deployable and not installed by
# install_airplay.py or install_bluetooth.py. Install as a file sorting after airplay.conf and
# bluetooth.conf (e.g. octet-remote.service.d/octet-remote-dsp.conf) via a reviewed atomic installer
# that first creates the octet-dsp-control GID and octet-autotune UID/GID, backing up and migrating
# Auto Tune state, with a tested rollback, all before any unit restart.
#
# Only adds octet-dsp-control to upmpdcli's supplementary groups. It never resets the list, so the
# AirPlay (audio upmpdcli) and Bluetooth (octet-bluetooth, bluetooth) groups are kept, and it does
# not touch Group, RuntimeDirectory or RuntimeDirectoryMode.
[Service]
SupplementaryGroups=octet-dsp-control
