# EX30 110 Hz preset confirmed for outputs 1/2. EX32 preset not yet located.
title: Measured exciter EQ with independent output controls
description: Verified EQ is assigned by exciter model; each measured stereo pair shares
  filters and headroom. Unmeasured outputs retain audition filters only.
devices:
  samplerate: 48000
  chunksize: 1024
  queuelimit: 4
  capture:
    type: Alsa
    channels: 2
    device: hw:Loopback,1,0
    format: S32_LE
  playback:
    type: Alsa
    channels: 8
    device: hw:sndrpihifiberry,0
    format: S32_LE
  volume_limit: 0.0
mixers:
  exciter_pairs:
    channels:
      in: 2
      out: 8
    mapping:
    - dest: 0
      sources:
      - channel: 0
        gain: 0
    - dest: 1
      sources:
      - channel: 1
        gain: 0
    - dest: 2
      sources:
      - channel: 0
        gain: 0
    - dest: 3
      sources:
      - channel: 1
        gain: 0
filters:
  audition_hp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyHighpass
      freq: 500
      order: 4
  audition_lp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyLowpass
      freq: 5000
      order: 4
  fixed_attenuation:
    type: Gain
    parameters:
      gain: -12
      inverted: false
      mute: false
  exciter_ex30_headroom:
    type: Gain
    parameters:
      gain: -3.1
      inverted: false
      mute: false
    description: "dml2_L \xB7 EX30HESF2-4"
  exciter_ex30_1:
    type: Biquad
    parameters:
      type: Highpass
      freq: 110.0
      q: 0.71
  exciter_ex30_2:
    type: Biquad
    parameters:
      type: Peaking
      freq: 170.0
      q: 1.97
      gain: 3.0
  exciter_ex30_3:
    type: Biquad
    parameters:
      type: Peaking
      freq: 301.0
      q: 2.26
      gain: -8.0
  exciter_ex30_4:
    type: Biquad
    parameters:
      type: Peaking
      freq: 689.0
      q: 2.69
      gain: 3.0
  exciter_ex30_5:
    type: Biquad
    parameters:
      type: Peaking
      freq: 969.0
      q: 3.0
      gain: -7.8
  exciter_ex30_6:
    type: Biquad
    parameters:
      type: Peaking
      freq: 1371.0
      q: 1.77
      gain: 3.0
  exciter_ex30_7:
    type: Biquad
    parameters:
      type: Peaking
      freq: 2236.0
      q: 1.25
      gain: 3.0
  exciter_ex30_8:
    type: Biquad
    parameters:
      type: Peaking
      freq: 5546.0
      q: 1.72
      gain: -8.0
  exciter_ex30_9:
    type: Biquad
    parameters:
      type: Peaking
      freq: 10471.0
      q: 1.59
      gain: 3.0
  output_1_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
  output_2_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
  output_3_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
  output_4_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
pipeline:
- type: Mixer
  name: exciter_pairs
- type: Filter
  channels:
  - 0
  - 1
  - 2
  - 3
  names:
  - audition_hp
  - audition_lp
  - fixed_attenuation
- type: Filter
  channels:
  - 0
  - 1
  names:
  - exciter_ex30_headroom
- type: Filter
  channels:
  - 0
  names:
  - exciter_ex30_1
  - exciter_ex30_2
  - exciter_ex30_3
  - exciter_ex30_4
  - exciter_ex30_5
  - exciter_ex30_6
  - exciter_ex30_7
  - exciter_ex30_8
  - exciter_ex30_9
  description: Output 1 measured EQ
  bypassed: false
- type: Filter
  channels:
  - 1
  names:
  - exciter_ex30_1
  - exciter_ex30_2
  - exciter_ex30_3
  - exciter_ex30_4
  - exciter_ex30_5
  - exciter_ex30_6
  - exciter_ex30_7
  - exciter_ex30_8
  - exciter_ex30_9
  description: Output 2 measured EQ
  bypassed: false
- type: Filter
  channels:
  - 0
  names:
  - output_1_polarity
  description: Output 1 polarity
- type: Filter
  channels:
  - 1
  names:
  - output_2_polarity
  description: Output 2 polarity
- type: Filter
  channels:
  - 2
  names:
  - output_3_polarity
  description: Output 3 polarity
- type: Filter
  channels:
  - 3
  names:
  - output_4_polarity
  description: Output 4 polarity
