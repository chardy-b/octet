# Eight assigned outputs. Subs and tweeters start muted; provisional filters and levels.
title: Eight-output speaker DSP
description: 1/2 EX30, 3/4 EX32, 5/6 left/right subs, 7/8 left/right tweeters. New
  pairs start muted; crossover and level settings are provisional.
devices:
  samplerate: 48000
  chunksize: 1024
  queuelimit: 4
  capture:
    type: Alsa
    channels: 2
    device: hw:Loopback,1,0
    format: S32_LE
  playback:
    type: Alsa
    channels: 8
    device: hw:sndrpihifiberry,0
    format: S32_LE
  volume_limit: 0.0
mixers:
  exciter_pairs:
    channels:
      in: 2
      out: 8
    mapping:
    - dest: 0
      sources:
      - channel: 0
        gain: 0
    - dest: 1
      sources:
      - channel: 1
        gain: 0
    - dest: 2
      sources:
      - channel: 0
        gain: 0
    - dest: 3
      sources:
      - channel: 1
        gain: 0
    - dest: 4
      sources:
      - channel: 0
        gain: 0
    - dest: 5
      sources:
      - channel: 1
        gain: 0
    - dest: 6
      sources:
      - channel: 0
        gain: 0
    - dest: 7
      sources:
      - channel: 1
        gain: 0
