      type: Peaking
      freq: 10471.0
      q: 1.59
      gain: 3.0
  output_1_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
  output_2_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
  output_3_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
  output_4_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
  exciter_ex32_headroom:
    type: Gain
    parameters:
      gain: -2.9
      inverted: false
      mute: false
    description: "dml2_R \xB7 EX32VBDS-4"
  exciter_ex32_1:
    type: Biquad
    parameters:
      type: Highpass
      freq: 120.0
      q: 0.71
  exciter_ex32_2:
