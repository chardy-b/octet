# No verified measured EQ assigned. Temporary audition settings only.
title: "Exciter audition \xB7 no measured EQ"
description: "EX30 on 1/2; EX32 on 3/4. No verified measured correction assigned.\
  \ Temporary 500 Hz\u20135 kHz filters and -12 dB attenuation remain."
devices:
  samplerate: 48000
  chunksize: 1024
  queuelimit: 4
  capture:
    type: Alsa
    channels: 2
    device: hw:Loopback,1,0
    format: S32_LE
  playback:
    type: Alsa
    channels: 8
    device: hw:sndrpihifiberry,0
    format: S32_LE
  volume_limit: 0.0
mixers:
  exciter_pairs:
    channels:
      in: 2
      out: 8
    mapping:
    - dest: 0
      sources:
      - channel: 0
        gain: 0
    - dest: 1
      sources:
      - channel: 1
        gain: 0
    - dest: 2
      sources:
      - channel: 0
        gain: 0
    - dest: 3
      sources:
      - channel: 1
        gain: 0
filters:
  audition_hp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyHighpass
      freq: 500
      order: 4
  audition_lp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyLowpass
      freq: 5000
      order: 4
  fixed_attenuation:
    type: Gain
    parameters:
      gain: -12
      inverted: false
      mute: false
  output_1_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
  output_2_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
  output_3_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
  output_4_polarity:
    type: Gain
    parameters:
      gain: 0.0
      inverted: false
      mute: false
pipeline:
- type: Mixer
  name: exciter_pairs
- type: Filter
  channels:
  - 0
  - 1
  - 2
  - 3
  names:
  - audition_hp
  - audition_lp
  - fixed_attenuation
- type: Filter
  channels:
  - 0
  names:
  - output_1_polarity
  description: Output 1 polarity
- type: Filter
  channels:
  - 1
  names:
  - output_2_polarity
  description: Output 2 polarity
- type: Filter
  channels:
  - 2
  names:
  - output_3_polarity
  description: Output 3 polarity
- type: Filter
  channels:
  - 3
  names:
  - output_4_polarity
  description: Output 4 polarity
