# User-assigned model EQ: dml2_L on 1/2, dml2_R on 3/4.
title: Measured exciter EQ with independent output controls
description: EX30 dml2_L on 1/2; EX32 dml2_R on 3/4. Matching EQ/headroom within each
  stereo pair. No extra attenuation on 3/4; existing -12 dB audition attenuation on
  1/2.
devices:
  samplerate: 48000
  chunksize: 1024
  queuelimit: 4
  capture:
    type: Alsa
    channels: 2
    device: hw:Loopback,1,0
    format: S32_LE
  playback:
    type: Alsa
    channels: 8
    device: hw:sndrpihifiberry,0
    format: S32_LE
  volume_limit: 0.0
mixers:
  exciter_pairs:
    channels:
      in: 2
      out: 8
    mapping:
    - dest: 0
      sources:
      - channel: 0
        gain: 0
    - dest: 1
      sources:
      - channel: 1
        gain: 0
    - dest: 2
      sources:
      - channel: 0
        gain: 0
    - dest: 3
      sources:
      - channel: 1
        gain: 0
filters:
  audition_hp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyHighpass
      freq: 500
      order: 4
  audition_lp:
    type: BiquadCombo
    parameters:
      type: LinkwitzRileyLowpass
      freq: 5000
      order: 4
  fixed_attenuation:
    type: Gain
    parameters:
      gain: -12
      inverted: false
      mute: false
  exciter_ex30_headroom:
    type: Gain
    parameters:
      gain: -3.1
      inverted: false
      mute: false
    description: "dml2_L \xB7 EX30HESF2-4"
  exciter_ex30_1:
    type: Biquad
    parameters:
      type: Highpass
      freq: 110.0
      q: 0.71
  exciter_ex30_2:
    type: Biquad
    parameters:
      type: Peaking
      freq: 170.0
      q: 1.97
      gain: 3.0
  exciter_ex30_3:
    type: Biquad
    parameters:
      type: Peaking
      freq: 301.0
      q: 2.26
      gain: -8.0
  exciter_ex30_4:
