// Octet classic AirPlay: dedicated loopback, never the DAC or MPD subdevice.
general = {
    name = "Octet";
    service_type = "classic";
    output_backend = "alsa";
    mdns_backend = "avahi";
    port = 5000;
    udp_port_base = 6001;
    udp_port_range = 10;
    ignore_volume_control = "no";
    volume_max_db = 0.0;
};
alsa = {
    output_device = "hw:Loopback,0,1";
    output_rate = 44100;
    output_format = "S32_LE";
    output_channels = 2;
    // No mixer_control_name: Shairport applies software attenuation only.
};
sessioncontrol = {
    run_this_before_play_begins = "/usr/bin/python3 /opt/octet-remote/airplay_control.py start";
    run_this_after_play_ends = "/usr/bin/python3 /opt/octet-remote/airplay_control.py stop";
    wait_for_completion = "yes";
    allow_session_interruption = "no";
};
