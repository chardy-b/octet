music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"
user                "mpd"
bind_to_address     "any"
port                "6600"

# Main path: MPD -> ALSA loopback -> CamillaDSP -> DAC8x
audio_output {
    type            "alsa"
    name            "CamillaDSP"
    device          "hw:Loopback,0,0"
    format          "48000:32:2"
    mixer_type      "none"
    auto_resample   "no"
    auto_format     "no"
}

# Visualizer tap (pre-DSP). Dropped silently if nothing is reading.
audio_output {
    type            "fifo"
    name            "Visualizer"
    path            "/run/mpd/mpd.fifo"
    format          "44100:16:2"
}

# Octet: never resume the saved queue automatically on boot.
restore_paused "yes"

# Octet: absorb network stalls and prefetch queued tracks.
audio_buffer_size "16 MB"
input_cache {
    size "128 MB"
}
