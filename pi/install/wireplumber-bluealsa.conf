# WirePlumber 0.5: keep PipeWire/ALSA available for the desktop while
# excluding WirePlumber's BlueZ audio monitor. BlueALSA is a separate manual
# A2DP sink service; this fragment alone does not prove exclusive ownership.
# Install only during a reviewed, reversible Octet Bluetooth trial.
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
  }
}
