[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octet-measure"
dynamic = ["version"]
description = "Measure loudspeakers with a swept sine and a calibrated microphone, then fit a parametric EQ. Runs in your browser."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["audio", "loudspeaker", "measurement", "room correction", "parametric eq", "dsp", "acoustics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sounddevice>=0.4.6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "PyYAML>=6.0",
  "websocket-client>=1.8",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]          # only for the PNG plots made by the command line
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
octet-measure = "octetmeasure.cli:main"

[tool.setuptools.dynamic]
version = { attr = "octetmeasure.__version__" }

[tool.setuptools.packages.find]
include = ["octetmeasure*"]

[tool.setuptools.package-data]
octetmeasure = ["ui/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
