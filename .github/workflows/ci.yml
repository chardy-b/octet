name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: measure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plots]"
      - name: Test
        run: python -m pytest -q
      - name: Build the wheel and check the app files are inside
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "import glob, zipfile; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); names = z.namelist(); assert any(n.endswith('ui/static/index.html') for n in names), 'static files missing from the wheel'; print(len(names), 'files in the wheel')"
